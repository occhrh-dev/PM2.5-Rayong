name: Collect PM2.5 daily data
on:
  schedule:
    - cron: '15 */6 * * *'   # ทุก 6 ชม.
  workflow_dispatch:          # กดรันเองได้จากแท็บ Actions

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect data
        run: python scripts/collect.py
      - name: Commit
        run: |
          git config user.name "pm25-bot"
          git config user.email "actions@github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: update $(date -u +%F_%H:%M)"
          git push
