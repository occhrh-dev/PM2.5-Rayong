name: Collect Air4Thai stations
on:
  schedule:
    - cron: '25 * * * *'   # ทุกชั่วโมง
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch Air4Thai
        run: python scripts/air4thai.py
      - name: Commit
        run: |
          git config user.name "pm25-bot"
          git config user.email "actions@github.com"
          git add data/air4thai.json
          git diff --cached --quiet || git commit -m "data: air4thai $(date -u +%F_%H:%M)"
          git push
