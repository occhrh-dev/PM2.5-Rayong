<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PM2.5 ระยอง — ค่าฝุ่นรายตำบล Real-time</title>
<meta name="theme-color" content="#16324a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌫️</text></svg>">
<link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
<style>
  :root{
    --c-vgood:#3BB3F4; --c-good:#3BC66E; --c-mod:#F4D23B;
    --c-unh:#F49C3B; --c-vunh:#E8503B; --c-nodata:#B8C2CC;
  }
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Sarabun','Segoe UI',sans-serif}
  body{height:100vh;display:flex;flex-direction:column;overflow:hidden}
  header{background:#16324a;color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;z-index:10}
  header h1{font-size:17px;font-weight:700}
  header .sub{font-size:12px;opacity:.75}
  #updated{margin-left:auto;font-size:12px;background:rgba(255,255,255,.12);padding:4px 10px;border-radius:14px}
  #refreshBtn{background:#3BB3F4;border:none;color:#fff;padding:5px 14px;border-radius:14px;font-size:13px;cursor:pointer}
  #refreshBtn:disabled{opacity:.5;cursor:wait}
  #mapwrap{flex:1;position:relative}
  #map{position:absolute;inset:0}
  @media (max-width:640px){
    header{padding:6px 10px;gap:6px}
    header h1{font-size:14px}
    header .sub{display:none}
    #updated{font-size:10px;padding:3px 8px}
    #refreshBtn,#baseBtn,#stnBtn{font-size:11px;padding:4px 10px}
    .legend{font-size:10px;padding:6px 8px;bottom:12px}
    .legend b{font-size:11px;margin-bottom:3px}
    .swatch{width:11px;height:11px}
    #ampPanel{min-width:140px;font-size:11px;padding:6px 8px;max-width:46%}
    .maplibregl-popup-content{min-width:230px;max-width:78vw}
  }
  .legend{position:absolute;bottom:24px;left:12px;background:#fff;border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.2);padding:10px 12px;font-size:12px;z-index:5}
  .legend b{display:block;margin-bottom:6px;font-size:13px}
  .lrow{display:flex;align-items:center;gap:7px;margin:3px 0}
  .swatch{width:16px;height:16px;border-radius:4px;flex:none}
  #progress{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:#fff;padding:6px 16px;border-radius:16px;box-shadow:0 2px 8px rgba(0,0,0,.25);font-size:13px;z-index:6;display:none}
  .maplibregl-popup-content{font-family:'Sarabun',sans-serif;padding:10px 12px;min-width:270px}
  .pp-name{font-weight:700;font-size:15px}
  .pp-amp{font-size:12px;color:#666;margin-bottom:6px}
  .pp-val{font-size:22px;font-weight:800}
  .pp-unit{font-size:12px;color:#666}
  .pp-badge{display:inline-block;padding:2px 10px;border-radius:12px;font-size:12px;color:#fff;margin-top:4px}
  .pp-time{font-size:11px;color:#999;margin-top:6px}
  .maplibregl-popup-close-button{font-size:24px;width:34px;height:34px;line-height:34px;border-radius:50%}
  .maplibregl-popup-close-button:hover{background:#eee}
  .maplibregl-popup-content{padding-right:30px}
  .ptab{border:1px solid #d5dde3;background:#fff;border-radius:12px;padding:2px 12px;font-size:11px;cursor:pointer;color:#666;font-family:'Sarabun',sans-serif}
  .ptab.active{background:#16324a;color:#fff;border-color:#16324a}
</style>
</head>
<body>
<header>
  <h1>🌫️ PM2.5 จังหวัดระยอง</h1>
  <span class="sub">รายตำบล · ข้อมูล GISTDA</span>
  <span id="updated">กำลังโหลด…</span>
  <button id="refreshBtn" onclick="loadPM(true)">รีเฟรช</button>
  <button id="stnBtn" onclick="toggleStations()" style="background:#0E7C7B;border:none;color:#fff;padding:5px 14px;border-radius:14px;font-size:13px;cursor:pointer">📍 สถานีวัดจริง</button>
  <button id="baseBtn" onclick="toggleBase()" style="background:#5a7d9a;border:none;color:#fff;padding:5px 14px;border-radius:14px;font-size:13px;cursor:pointer">🛰️ ดาวเทียม</button>
</header>
<div id="mapwrap">
<div id="map"></div>
<div id="progress">กำลังดึงข้อมูลฝุ่น… <span id="pcount"></span></div>
<div id="ampPanel" style="position:absolute;top:12px;right:12px;background:#fff;border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.2);padding:10px 12px;font-size:12px;z-index:5;min-width:180px;display:none">
  <b style="display:block;margin-bottom:6px;font-size:13px;cursor:pointer" onclick="const l=document.getElementById('ampList');l.style.display=l.style.display==='none'?'block':'none'">อันดับรายอำเภอ (µg/m³) ▾</b>
  <div id="ampList"></div>
</div>
<div class="legend">
  <b>PM2.5 (µg/m³) เกณฑ์ไทย</b>
  <div class="lrow"><span class="swatch" style="background:var(--c-vgood)"></span>0 – 15 ดีมาก</div>
  <div class="lrow"><span class="swatch" style="background:var(--c-good)"></span>15.1 – 25 ดี</div>
  <div class="lrow"><span class="swatch" style="background:var(--c-mod)"></span>25.1 – 37.5 ปานกลาง</div>
  <div class="lrow"><span class="swatch" style="background:var(--c-unh)"></span>37.6 – 75 เริ่มมีผลต่อสุขภาพ</div>
  <div class="lrow"><span class="swatch" style="background:var(--c-vunh)"></span>&gt; 75 มีผลต่อสุขภาพ</div>
  <div class="lrow"><span class="swatch" style="background:var(--c-nodata)"></span>ไม่มีข้อมูล</div>
</div>
</div>
<script>
// ================= CONFIG =================
const MAPTILER_KEY = 'XOw46Ht6gxyHhSCkLXPf';
// GISTDA endpoint (แอปเช็คฝุ่นใช้) — ถ้าโดน CORS ให้ตั้ง PROXY_URL เป็น Cloudflare Worker
const GISTDA_URL = (lat,lng)=>`https://pm25.gistda.or.th/rest/getPm25byLocation?lat=${lat}&lng=${lng}`;
const PROXY_URL = ''; // ex: 'https://pm25-proxy.xxx.workers.dev/?lat={lat}&lng={lng}'
// ประวัติรายวันเก็บโดย GitHub Actions ลงไฟล์ static ใน repo
const DAILY_URL = 'data/daily.json';
const REFRESH_MIN = 60;        // auto refresh ทุก 60 นาที
const CACHE_MIN = 50;          // ใช้ cache ถ้าอายุไม่เกิน 50 นาที
const CONCURRENCY = 6;
// ==========================================

const COLORS = {vgood:'#3BB3F4',good:'#3BC66E',mod:'#F4D23B',unh:'#F49C3B',vunh:'#E8503B',nodata:'#B8C2CC'};
function levelOf(v){
  if(v==null||isNaN(v)) return ['nodata','ไม่มีข้อมูล'];
  if(v<=15) return ['vgood','ดีมาก'];
  if(v<=25) return ['good','ดี'];
  if(v<=37.5) return ['mod','ปานกลาง'];
  if(v<=75) return ['unh','เริ่มมีผลต่อสุขภาพ'];
  return ['vunh','มีผลต่อสุขภาพ'];
}

let map, gj, centroids={}, pmData={}, STYLES, curBase='streets', amphoeData=null, dailyData=null, stnMarkers=[], stnOn=false, altPoints={}, ptOverride={}; // pmData[tam_code] = {pm25, time}

function centroid(f){
  const g=f.geometry;
  let ring = g.type==='Polygon' ? g.coordinates[0] : g.coordinates.reduce((a,b)=>b[0].length>a[0].length?b:a)[0];
  let x=0,y=0; ring.forEach(c=>{x+=c[0];y+=c[1]});
  return [x/ring.length, y/ring.length];
}

async function init(){
  const [gjr, cr, ar] = await Promise.all([fetch('rayong_tambon.geojson'), fetch('data/centroids.json'), fetch('data/alt_points.json')]);
  gj = await gjr.json();
  const pre = cr.ok ? await cr.json() : {};
  altPoints = ar.ok ? await ar.json() : {};
  try{ ptOverride = JSON.parse(localStorage.getItem('pt_override_v1')||'{}'); }catch(e){ ptOverride={}; }
  gj.features.forEach(f=>{
    const c=f.properties.tam_code;
    centroids[c] = pre[c] || centroid(f); // ใช้จุด polylabel จากไฟล์ ถ้าไม่มีค่อยคำนวณ
    f.properties.pm25=null; f.properties.level='nodata';
  });

  STYLES = {
    streets:`https://api.maptiler.com/maps/streets-v2/style.json?key=${MAPTILER_KEY}`,
    sat:`https://api.maptiler.com/maps/hybrid/style.json?key=${MAPTILER_KEY}`
  };
  map = new maplibregl.Map({
    container:'map', style:STYLES.streets,
    center:[101.35,12.85], zoom:9.3
  });
  map.addControl(new maplibregl.NavigationControl(),'bottom-right');

  map.on('load',()=>{
    addTambonLayers();

    map.on('click','tambon-fill',e=>{
      const p=e.features[0].properties;
      const d=pmData[p.tam_code]||{};
      const [lv,label]=levelOf(d.pm25);
      const daily=dailyChart(p.tam_code), hourly=sparkline(d.hist);
      const tabs=(daily&&hourly)?`
        <div style="display:flex;gap:4px;margin-top:8px">
          <button class="ptab active" onclick="swTab(this,'pcDaily')">รายวัน</button>
          <button class="ptab" onclick="swTab(this,'pcHourly')">24 ชม.</button>
        </div>`:'';
      new maplibregl.Popup({maxWidth:'300px'}).setLngLat(e.lngLat).setHTML(`
        <div class="pp-name">ต.${p.tam_th} <span class="pp-amp">· ${p.amp_th}</span></div>
        <div style="display:flex;align-items:baseline;gap:8px;margin-top:2px">
          <span class="pp-val" style="color:${COLORS[lv]}">${d.pm25!=null?d.pm25.toFixed(1):'–'}</span>
          <span class="pp-unit">µg/m³</span>
          <span class="pp-badge" style="background:${COLORS[lv]}">${label}</span>
        </div>
        <div class="pp-unit" style="margin-top:2px">เฉลี่ย 24 ชม. ${d.avg24!=null?d.avg24.toFixed(1):'–'} µg/m³</div>
        ${eocStatusLine(p.tam_code)}
        ${tabs}
        <div id="pcDaily">${daily}</div>
        <div id="pcHourly" style="display:${daily?'none':'block'}">${hourly}</div>
        ${d.mismatch?'<div class="pp-time" style="color:#E8503B">⚠️ ค่าจากตำบลข้างเคียง</div>':''}
        <div class="pp-time">${d.time||''}</div>
      `).addTo(map);
    });
    map.on('mouseenter','tambon-fill',()=>map.getCanvas().style.cursor='pointer');
    map.on('mouseleave','tambon-fill',()=>map.getCanvas().style.cursor='');

    loadPM(false);
    loadDaily();
    loadForecast();
    setInterval(()=>loadPM(true), REFRESH_MIN*60*1000);
  });
}

async function fetchPoint(lat,lng){
  const url = PROXY_URL
    ? PROXY_URL.replace('{lat}',lat).replace('{lng}',lng)
    : GISTDA_URL(lat,lng);
  const r = await fetch(url);
  if(!r.ok) throw new Error('HTTP '+r.status);
  const j = await r.json();
  const d = j.data ?? j;
  const pm = d.pm25 ?? null;
  // dt ใน graphHistory24hrs เป็น UTC → แปลงเป็นเวลาไทย (+7)
  let t = '';
  const hist = d.graphHistory24hrs;
  if(Array.isArray(hist) && hist.length){
    const iso = hist[hist.length-1][1];
    const dt = new Date(iso);
    t = dt.toLocaleString('th-TH',{timeZone:'Asia/Bangkok',weekday:'long',day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'}) + ' น.';
  }
  const tb = d.loc && d.loc.tb_idn!=null ? String(d.loc.tb_idn) : null;
  if(Array.isArray(d.pm25_amphoe) && d.pm25_amphoe.length) amphoeData = d.pm25_amphoe;
  return {pm25: pm!=null?+pm:null, time:t, avg24: d.pm25Avg24hrs!=null?+d.pm25Avg24hrs:null, tb_idn: tb, hist: hist||[]};
}

async function loadPM(force){
  const btn=document.getElementById('refreshBtn'); btn.disabled=true;
  const prog=document.getElementById('progress'), pc=document.getElementById('pcount');
  prog.style.display='block';

  // cache
  const cacheKey='pm25_rayong_cache_v2';
  if(!force){
    try{
      const c=JSON.parse(localStorage.getItem(cacheKey));
      const firstD=c&&c.data&&Object.values(c.data)[0];
      if(c && firstD && Array.isArray(firstD.hist) && Date.now()-c.ts < CACHE_MIN*60*1000){ pmData=c.data; amphoeData=c.amphoe||null; applyData(c.ts); renderAmphoe(); btn.disabled=false; prog.style.display='none'; return; }
    }catch(e){}
  }

  const codes=Object.keys(centroids);
  let done=0, fail=0; const mismatches=[];
  pc.textContent=`0/${codes.length}`;
  const queue=[...codes];
  async function worker(){
    while(queue.length){
      const code=queue.shift();
      // ลำดับจุด: จุดที่เคยใช้ได้ → จุดหลัก → จุดสำรอง (ลึกขึ้นเรื่อย ๆ)
      const cands=[];
      if(ptOverride[code]) cands.push(ptOverride[code]);
      cands.push(centroids[code], ...(altPoints[code]||[]));
      let res=null;
      try{
        for(const pt of cands){
          const r=await fetchPoint(pt[1].toFixed(5),pt[0].toFixed(5));
          if(!r.tb_idn || r.tb_idn===code){
            res=r;
            if(String(pt)!==String(centroids[code])){ ptOverride[code]=pt; }
            break;
          }
          res=r; // เก็บตัวสุดท้ายไว้ใช้ถ้าไม่ตรงสักจุด
        }
        res.mismatch = !!(res.tb_idn && res.tb_idn!==code);
        if(res.mismatch) mismatches.push({expect:code, got:res.tb_idn});
        pmData[code]=res;
      }catch(e){ if(res){pmData[code]=res;} else fail++; }
      done++; pc.textContent=`${done}/${codes.length}`;
    }
  }
  await Promise.all(Array.from({length:CONCURRENCY},worker));

  const ts=Date.now();
  try{ localStorage.setItem(cacheKey,JSON.stringify({ts,data:pmData,amphoe:amphoeData})); }catch(e){}
  try{ localStorage.setItem('pt_override_v1',JSON.stringify(ptOverride)); }catch(e){}
  applyData(ts); renderAmphoe();
  prog.style.display='none'; btn.disabled=false;
  if(mismatches.length){
    console.warn('Tambon mismatch:', mismatches);
    const el=document.getElementById('updated');
    el.textContent += ` · ⚠️ ${mismatches.length} ตำบลตกขอบเขต (แตะดู)`;
    const detail = mismatches.map(m=>{
      const f=gj.features.find(f=>f.properties.tam_code===m.expect);
      return `ต.${f?f.properties.tam_th:m.expect} (คาด ${m.expect} ได้ ${m.got})`;
    }).join('\n');
    el.title = detail;
    el.style.cursor='pointer';
    el.onclick = ()=>alert('จุดเก็บค่าตกนอกเขตตาม GISTDA:\n'+detail+'\n\nค่าที่แสดงเป็นของพื้นที่ข้างเคียง (มักต่างกันน้อยมาก)');
  }
  if(fail===codes.length){
    document.getElementById('updated').textContent='⚠️ ดึงข้อมูลไม่สำเร็จ (อาจติด CORS — ต้องใช้ proxy)';
  }
}

async function loadForecast(){
  try{
    const r=await fetch('https://pm25.gistda.or.th/rest/getPm25byProvincePred3');
    const j=await r.json();
    const ry=(j.data||[]).find(p=>p.pv_idn===21);
    if(!ry) return;
    const preds=[ry.pred1,ry.pred2,ry.pred3].map(v=>+v);
    const now=+ry.pm25;
    const trend = preds[2]>now+1 ? '↗' : preds[2]<now-1 ? '↘' : '→';
    const worst=Math.max(...preds);
    const [lv]=levelOf(worst);
    let warn='';
    if(worst>WATCH_THRESHOLD) warn=`<div style="color:${worst>EOC_THRESHOLD?'#E8503B':'#F49C3B'};font-weight:600;margin-top:2px">⚠️ คาดการณ์แตะระดับ${worst>EOC_THRESHOLD?'มีผลต่อสุขภาพ':'เฝ้าระวัง'}</div>`;
    const el=document.createElement('div');
    el.style.cssText='border-top:1px solid #eee;margin-top:6px;padding-top:6px;font-size:12px';
    el.innerHTML=`<b style="font-size:12px">คาดการณ์ (จังหวัด) ${trend}</b>
      <div style="display:flex;gap:6px;align-items:center;margin-top:3px">
        ${preds.map((v,i)=>`<span style="background:${COLORS[levelOf(v)[0]]};color:#fff;border-radius:10px;padding:1px 8px;font-weight:600">${v.toFixed(1)}</span>${i<2?'<span style="color:#bbb">→</span>':''}`).join('')}
      </div>${warn}`;
    document.getElementById('ampPanel').appendChild(el);
    document.getElementById('ampPanel').style.display='block';
  }catch(e){ console.warn('forecast unavailable', e); }
}

async function loadDaily(){
  try{
    const r=await fetch(DAILY_URL+'?t='+Date.now());
    if(!r.ok) return;
    const j=await r.json();
    dailyData=j.slice(-7); renderEocBanner();
  }catch(e){ console.warn('daily history unavailable', e); }
}

// เกณฑ์เฝ้าระวังเปิด EOC: ค่าเฉลี่ยรายวันเกินเกณฑ์ติดต่อกัน
const EOC_THRESHOLD = 75;    // µg/m³ (มีผลต่อสุขภาพ)
const WATCH_THRESHOLD = 37.5;// µg/m³ (เริ่มมีผลต่อสุขภาพ)
const EOC_DAYS = 3;

function streakOf(code, threshold){
  if(!dailyData) return 0;
  let s=0;
  for(let i=dailyData.length-1;i>=0;i--){
    const d=dailyData[i].data&&dailyData[i].data[code];
    if(d&&d.avg!=null&&d.avg>threshold) s++; else break;
  }
  return s;
}

function renderEocBanner(){
  if(!dailyData||!dailyData.length) return;
  const codes=Object.keys(centroids);
  const eoc=[], watch=[];
  codes.forEach(c=>{
    const f=gj.features.find(f=>f.properties.tam_code===c);
    const name=f?f.properties.tam_th:c;
    const s75=streakOf(c,EOC_THRESHOLD);
    const s37=streakOf(c,WATCH_THRESHOLD);
    if(s75>=EOC_DAYS) eoc.push(`ต.${name} (${s75} วัน)`);
    else if(s37>=EOC_DAYS) watch.push(`ต.${name} (${s37} วัน)`);
  });
  let el=document.getElementById('eocBanner');
  if(!el){
    el=document.createElement('div'); el.id='eocBanner';
    el.style.cssText='position:absolute;top:12px;left:50%;transform:translateX(-50%);max-width:80%;border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.3);padding:8px 16px;font-size:13px;z-index:7;font-weight:600';
    document.getElementById('mapwrap').appendChild(el);
  }
  if(eoc.length){
    el.style.background='#E8503B'; el.style.color='#fff'; el.style.display='block';
    el.textContent=`🚨 เข้าเกณฑ์พิจารณาเปิด EOC: เกิน ${EOC_THRESHOLD} µg/m³ ติดต่อกัน ≥${EOC_DAYS} วัน — ${eoc.join(', ')}`;
  }else if(watch.length){
    el.style.background='#F49C3B'; el.style.color='#fff'; el.style.display='block';
    el.textContent=`⚠️ เฝ้าระวัง: เกิน ${WATCH_THRESHOLD} µg/m³ ติดต่อกัน ≥${EOC_DAYS} วัน — ${watch.join(', ')}`;
  }else{
    el.style.display='none';
  }
}

function dailyChart(code){
  if(!dailyData||!dailyData.length) return '';
  const rows=dailyData.map(d=>({date:d.date, avg:d.data&&d.data[code]?d.data[code].avg:null, hours:d.data&&d.data[code]?d.data[code].hours:0}))
                      .filter(r=>r.avg!=null);
  if(!rows.length) return '';
  const W=250,H=80,PL=8,PR=8,PT=14,PB=18,slot=(W-PL-PR)/Math.max(rows.length,7);
  const mx=Math.max(...rows.map(r=>r.avg),1);
  const thDay=s=>{const d=new Date(s+'T00:00:00');return d.getDate()+'/'+(d.getMonth()+1);};
  const bars=rows.map((r,i)=>{
    const bh=(r.avg/mx)*(H-PT-PB);
    const x=PL+i*slot+slot*0.15, bw=slot*0.7, y=H-PB-bh;
    const [lv]=levelOf(r.avg);
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="3" fill="${COLORS[lv]}"/>
      <text x="${(x+bw/2).toFixed(1)}" y="${(y-4).toFixed(1)}" font-size="9" text-anchor="middle" fill="#333">${r.avg.toFixed(1)}</text>
      <text x="${(x+bw/2).toFixed(1)}" y="${H-6}" font-size="8.5" text-anchor="middle" fill="#888">${thDay(r.date)}</text>`;
  }).join('');
  return `<svg width="${W}" height="${H}" style="display:block;margin-top:4px">${bars}</svg>`;
}

async function toggleStations(){
  const btn=document.getElementById('stnBtn');
  if(stnOn){
    stnMarkers.forEach(m=>m.remove()); stnMarkers=[]; stnOn=false;
    btn.style.background='#0E7C7B'; btn.textContent='📍 สถานีวัดจริง';
    return;
  }
  let stations=[];
  try{
    const r=await fetch('data/air4thai.json?t='+Date.now());
    if(r.ok) stations=await r.json();
  }catch(e){}
  if(!stations.length){ btn.textContent='📍 ไม่มีข้อมูลสถานี'; setTimeout(()=>btn.textContent='📍 สถานีวัดจริง',2500); return; }
  stations.forEach(s=>{
    const [lv,label]=levelOf(s.pm25);
    const el=document.createElement('div');
    el.style.cssText=`width:34px;height:34px;border-radius:50%;background:${COLORS[lv]};border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;font:700 11px Sarabun,sans-serif;color:#fff;cursor:pointer`;
    el.textContent = s.pm25!=null ? Math.round(s.pm25) : '–';
    const popup=new maplibregl.Popup({offset:20,maxWidth:'280px'}).setHTML(`
      <div class="pp-name">📍 ${s.name||s.id}</div>
      <div class="pp-amp">สถานีวัดจริง กรมควบคุมมลพิษ (Air4Thai)</div>
      <div style="display:flex;align-items:baseline;gap:8px;margin-top:2px">
        <span class="pp-val" style="color:${COLORS[lv]}">${s.pm25!=null?s.pm25.toFixed(1):'–'}</span>
        <span class="pp-unit">µg/m³</span>
        <span class="pp-badge" style="background:${COLORS[lv]}">${label}</span>
      </div>
      ${s.aqi!=null?`<div class="pp-unit" style="margin-top:2px">AQI ${s.aqi}</div>`:''}
      <div class="pp-time">${s.date||''} ${s.time||''}</div>`);
    const mk=new maplibregl.Marker({element:el}).setLngLat([s.lng,s.lat]).addTo(map);
    el.addEventListener('click',ev=>{
      ev.stopPropagation();
      popup.setLngLat([s.lng,s.lat]).addTo(map);
    });
    stnMarkers.push(mk);
  });
  stnOn=true;
  btn.style.background='#16324a'; btn.textContent='📍 ซ่อนสถานี';
}

function swTab(btn,id){
  document.querySelectorAll('.ptab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('pcDaily').style.display = id==='pcDaily'?'block':'none';
  document.getElementById('pcHourly').style.display = id==='pcHourly'?'block':'none';
}

function eocStatusLine(code){
  if(!dailyData||!dailyData.length) return '';
  const s75=streakOf(code,EOC_THRESHOLD), s37=streakOf(code,WATCH_THRESHOLD);
  if(s75>0) return `<div style="font-size:11px;color:#E8503B;font-weight:600">🚨 เกิน ${EOC_THRESHOLD} ติดต่อกัน ${s75} วัน (เกณฑ์ EOC: ${EOC_DAYS} วัน)</div>`;
  if(s37>0) return `<div style="font-size:11px;color:#F49C3B;font-weight:600">⚠️ เกิน ${WATCH_THRESHOLD} ติดต่อกัน ${s37} วัน</div>`;
  return '';
}

function sparkline(hist){
  if(!Array.isArray(hist)||hist.length<2) return '';
  const W=250,H=72,PL=8,PR=8,PT=14,PB=16;
  const vals=hist.map(h=>+h[0]);
  const mn=Math.min(...vals), mx=Math.max(...vals), rng=(mx-mn)||1;
  const X=i=>PL+i*(W-PL-PR)/(vals.length-1);
  const Y=v=>PT+(H-PT-PB)-(v-mn)/rng*(H-PT-PB);
  const pts=vals.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
  const thTime=iso=>new Date(iso).toLocaleTimeString('th-TH',{timeZone:'Asia/Bangkok',hour:'numeric'});
  // ตัวเลขค่าทุกจุด (สลับบน-ล่างกันทับ)
  const valLabels=vals.map((v,i)=>{
    const above=(i%2===0);
    return `<text x="${X(i).toFixed(1)}" y="${(Y(v)+(above?-5:11)).toFixed(1)}" font-size="8.5" text-anchor="middle" fill="#333">${v.toFixed(1)}</text>`;
  }).join('');
  // เวลาแกนล่าง ทุก 2-3 จุด + จุดสุดท้ายเสมอ
  const step=vals.length>8?3:2;
  const timeLabels=hist.map((h,i)=>{
    if(i%step!==0 && i!==vals.length-1) return '';
    return `<text x="${X(i).toFixed(1)}" y="${H-4}" font-size="8.5" text-anchor="middle" fill="#888">${thTime(h[1])}น.</text>`;
  }).join('');
  const dots=vals.map((v,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="2.2" fill="${i===vals.length-1?'#16324a':'#3BB3F4'}"/>`).join('');
  return `<svg width="${W}" height="${H}" style="display:block;margin-top:4px">
      <polyline points="${pts}" fill="none" stroke="#3BB3F4" stroke-width="1.8" stroke-linejoin="round"/>
      ${dots}${valLabels}${timeLabels}
    </svg>`;
}

function addTambonLayers(){
  if(map.getSource('tambon')) return;
  map.addSource('tambon',{type:'geojson',data:gj});
  map.addLayer({id:'tambon-fill',type:'fill',source:'tambon',paint:{
    'fill-color':['match',['get','level'],
      'vgood',COLORS.vgood,'good',COLORS.good,'mod',COLORS.mod,
      'unh',COLORS.unh,'vunh',COLORS.vunh,COLORS.nodata],
    'fill-opacity':curBase==='sat'?0.62:0.55
  }});
  map.addLayer({id:'tambon-line',type:'line',source:'tambon',paint:{
    'line-color':curBase==='sat'?'#ffffff':'#16324a','line-width':0.8,'line-opacity':0.7}});
  if(!map.getSource('tambon-labels')){
    const pts={type:'FeatureCollection',features:gj.features.map(f=>({
      type:'Feature',
      properties:{name:f.properties.tam_th},
      geometry:{type:'Point',coordinates:centroids[f.properties.tam_code]}
    }))};
    map.addSource('tambon-labels',{type:'geojson',data:pts});
  }
  map.addLayer({id:'tambon-label',type:'symbol',source:'tambon-labels',
    minzoom:9.5,
    layout:{'text-field':['get','name'],'text-size':['interpolate',['linear'],['zoom'],9.5,10,12,13],
      'text-font':['Noto Sans Regular'],'text-allow-overlap':false},
    paint:{'text-color':curBase==='sat'?'#ffffff':'#16324a',
      'text-halo-color':curBase==='sat'?'rgba(0,0,0,0.7)':'rgba(255,255,255,0.9)','text-halo-width':1.4}});
}

function toggleBase(){
  curBase = curBase==='streets'?'sat':'streets';
  document.getElementById('baseBtn').textContent = curBase==='streets'?'🛰️ ดาวเทียม':'🗺️ แผนที่ถนน';
  map.setStyle(STYLES[curBase]);
  map.once('styledata',()=>{ addTambonLayers(); });
}

function renderAmphoe(){
  if(!amphoeData) return;
  const list=[...amphoeData].sort((a,b)=>b.pm25-a.pm25);
  document.getElementById('ampList').innerHTML=list.map((a,i)=>{
    const [lv]=levelOf(a.pm25);
    return `<div style="display:flex;align-items:center;gap:6px;margin:3px 0">
      <span style="width:14px;color:#999">${i+1}</span>
      <span style="width:10px;height:10px;border-radius:50%;background:${COLORS[lv]};flex:none"></span>
      <span style="flex:1">${a.ap_tn}</span>
      <b>${(+a.pm25).toFixed(1)}</b></div>`;
  }).join('');
  const panel=document.getElementById('ampPanel');
  if(window.innerWidth<640 && panel.style.display==='none')
    document.getElementById('ampList').style.display='none';
  panel.style.display='block';
}

function applyData(ts){
  gj.features.forEach(f=>{
    const d=pmData[f.properties.tam_code];
    f.properties.pm25 = d?d.pm25:null;
    f.properties.pm_time = d?d.time:'';
    f.properties.avg24 = d&&d.avg24!=null?d.avg24:null;
    f.properties.mismatch = d?!!d.mismatch:false;
    f.properties.level = levelOf(d?d.pm25:null)[0];
  });
  if(map.getSource('tambon')) map.getSource('tambon').setData(gj);
  document.getElementById('updated').textContent='อัปเดต: '+new Date(ts).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'})+' น.';
}

init();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
